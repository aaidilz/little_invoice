name: little_invoice
description: Offline mobile invoice application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  intl: ^0.20.2
  uuid: ^4.4.2
  open_file: ^3.3.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.png"
  remove_alpha_ios: true
